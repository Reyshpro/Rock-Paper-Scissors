<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="12-rock-paper-scissors .css">
</head>

<body>

  <p class="title">Rock Paper Scissors</p>

  <button 
    class="move-button js-rock-button"> 
  <img src="images/rock.png" alt="rock" class="move-icon" >
  </button>

   <button class="move-button js-paper-button"><img src="images/paper.png" alt="paper" class="move-icon"></button>

    <button onclick="
      playGame('Scissors');
    " class="move-button js-scissors-button"><img src="images/scissors.png" alt="scissors" class="move-icon"></button>

      <p class="js-result result"></p>

      <p class="js-moves">
      </p>

      <p class="js-score score" ></p>

    <button 
    class="reset-score-button reset-js-button"
    >
      Reset Score
    </button>

        <div id="confirm-popup" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgb(14, 14, 14); border:1px solid black; padding:20px; z-index:1000;">
      <p>Are you sure you want to reset the score?</p>
      <button id="yes-btn">Yes</button>
      <button id="no-btn">No</button>
    </div>
    <div id="overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.5); z-index:999;"></div>

    <button class="auto-play-btn auto-js-btn" >Auto Play</button>

  <script src="12-rock-paper-scissors .js"></script>



</body>
</html>
